<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXT FULL TOOL</title>
    <link rel="icon" href="https://i.ibb.co/RkPzT8b2/IMG-0806.jpg">
    <link rel="apple-touch-icon" href="https://i.ibb.co/RkPzT8b2/IMG-0806.jpg">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: #000; height: 100vh; width: 100vw; display: flex; justify-content: center; align-items: center; font-family: -apple-system, sans-serif; overflow: hidden; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        #plexus-canvas { z-index: 1; }
        #matrix-canvas { z-index: 50; display: none; }

        /* Custom Paste Modal - No File Name */
        #custom-paste-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 10000; display: none; justify-content: center; align-items: center; backdrop-filter: blur(8px); }
        .modal-content { background: #111; border: 1px solid #ff0000; padding: 30px; border-radius: 20px; width: 85%; max-width: 320px; text-align: center; box-shadow: 0 0 40px rgba(255,0,0,0.4); }
        .modal-content h3 { color: #fff; margin-bottom: 20px; font-size: 16px; letter-spacing: 2px; font-family: monospace; }
        #modal-input { width: 100%; padding: 15px; background: #000; border: 1px solid #ff0000; color: #fff; border-radius: 12px; margin-bottom: 20px; text-align: center; outline: none; font-size: 16px; }
        .modal-btns { display: flex; gap: 12px; }
        .m-btn { flex: 1; padding: 14px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; font-size: 12px; }
        .btn-ok { background: #ff0000; color: #fff; }
        .btn-cancel { background: #222; color: #888; }

        /* UI Design */
        #lock-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); z-index: 9999; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(15px); }
        #password-input { background: rgba(255, 0, 0, 0.1); border: 2px solid #ff0000; padding: 18px; color: #fff; font-size: 18px; text-align: center; outline: none; border-radius: 15px; width: 80%; max-width: 300px; }
        .container { position: relative; z-index: 10; width: 90%; max-width: 380px; text-align: center; display: none; }
        .profile-container { width: 110px; height: 110px; margin: 0 auto 25px; border: 2px solid #ff0000; border-radius: 25px; box-shadow: 0 0 25px rgba(255, 0, 0, 0.5); overflow: hidden; }
        .profile-container img { width: 100%; height: 100%; object-fit: cover; }
        h1 { color: #fff; font-size: 24px; letter-spacing: 3px; text-shadow: 0 0 10px #ff0000; margin-bottom: 35px; font-family: monospace; }
        .button-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
        .action-btn { background: rgba(255, 255, 255, 0.03); color: #fff; border: 1px solid rgba(255, 0, 0, 0.4); border-radius: 12px; padding: 20px 5px; font-size: 10px; font-weight: bold; text-transform: uppercase; backdrop-filter: blur(10px); width: 100%; cursor: pointer; }
        #id-input-field { background: rgba(0, 0, 0, 0.8); border: 1px solid #ff0000; padding: 18px; width: 100%; color: #fff; border-radius: 12px; text-align: center; font-size: 18px; margin-bottom: 10px; outline: none; }
        .paste-btn { background: none; border: 1px dashed #ff0000; color: #ff0000; padding: 10px; width: 100%; border-radius: 10px; margin-bottom: 20px; font-size: 10px; cursor: pointer; }
        .back-btn { color: #ff0000; font-size: 12px; display: block; margin-top: 25px; font-family: monospace; cursor: pointer; }
        #final-result { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 100; width: 85%; max-width: 350px; text-align: center; display: none; }
        .res-box { background: rgba(0,0,0,0.8); border: 1px solid #f00; color: #fff; padding: 20px; border-radius: 15px; margin-bottom: 10px; font-family: monospace; }
    </style>
</head>
<body>

    <canvas id="plexus-canvas"></canvas>
    <canvas id="matrix-canvas"></canvas>

    <div id="custom-paste-modal">
        <div class="modal-content">
            <h3>PASTE ID</h3>
            <input type="text" id="modal-input" placeholder="Enter or paste ID...">
            <div class="modal-btns">
                <button class="m-btn btn-cancel" onclick="closeModal()">CANCEL</button>
                <button class="m-btn btn-ok" onclick="confirmPaste()">OK</button>
            </div>
        </div>
    </div>

    <div id="lock-screen">
        <input type="password" id="password-input" placeholder="ACCESS KEY" onkeydown="checkKey(event)">
    </div>

    <div id="main-ui" class="container">
        <div class="profile-container"><img src="https://i.ibb.co/RkPzT8b2/IMG-0806.jpg"></div>
        <h1>NEXT FULL TOOL</h1>
        <div class="button-grid">
            <button class="action-btn" onclick="openInput()">BAN PLAYER</button>
            <button class="action-btn" onclick="openInput()">CHECK PLAYER</button>
            <button class="action-btn" onclick="openInput()">GLITCH BAN</button>
            <button class="action-btn" onclick="openInput()">INFO PLAYER</button>
            <button class="action-btn" onclick="openInput()">INFO ROOM</button>
            <button class="action-btn" onclick="openInput()">SERVER INFO</button>
            <button class="action-btn" onclick="openInput()">GHOST MODE</button>
            <button class="action-btn" onclick="openInput()">BYPASS</button>
        </div>
    </div>

    <div id="id-page" class="container">
        <h2 style="color:#fff; margin-bottom: 25px; font-family: monospace; font-size: 14px;">TARGET SYSTEM</h2>
        <input type="number" id="id-input-field" placeholder="INPUT ID" inputmode="numeric">
        <button class="paste-btn" onclick="openModal()">PASTE FROM CLIPBOARD</button>
        <button class="action-btn" style="padding: 22px; border-color: #f00; font-size: 14px;" onclick="runMatrix()">EXECUTE</button>
        <span class="back-btn" onclick="showMain()">[ BACK ]</span>
    </div>

    <div id="final-result">
        <div class="res-box" id="res-target"></div>
        <div class="res-box" style="border-color: #f00; color: #f00; box-shadow: 0 0 15px #f00;">STATUS: SUCCESS</div>
        <span class="back-btn" onclick="location.reload()">[ MENU ]</span>
    </div>

    <script>
        // هذا الجزء يمنع أخطاء المتصفح (Safe H5GG Logic)
        function safeH5GG(action) {
            if (typeof h5gg !== 'undefined') {
                try { action(); } catch(e) { console.log("H5GG action blocked by system"); }
            }
        }

        window.onload = () => {
            // تغيير أيقونة h5gg العائمة لتطابق صورتك الشخصية
            safeH5GG(() => h5gg.setFloatIcon("https://i.ibb.co/RkPzT8b2/IMG-0806.jpg"));
            initP(); animateP();
        };

        function openModal() { document.getElementById('custom-paste-modal').style.display = 'flex'; document.getElementById('modal-input').focus(); }
        function closeModal() { document.getElementById('custom-paste-modal').style.display = 'none'; }
        function confirmPaste() { let val = document.getElementById('modal-input').value; if(val) document.getElementById('id-input-field').value = val.trim(); closeModal(); }

        function checkKey(e) { if (e.key === "Enter" && document.getElementById('password-input').value.toUpperCase() === "NEXTHEX") { document.getElementById('lock-screen').style.display = "none"; document.getElementById('main-ui').style.display = "block"; } }
        function openInput() { document.getElementById('main-ui').style.display = "none"; document.getElementById('id-page').style.display = "block"; }
        function showMain() { document.getElementById('id-page').style.display = "none"; document.getElementById('main-ui').style.display = "block"; }

        function runMatrix() {
            let id = document.getElementById('id-input-field').value; if(!id) return;
            document.getElementById('id-page').style.display = "none";
            const mc = document.getElementById('matrix-canvas'); mc.style.display = "block";
            const ctx = mc.getContext('2d'); mc.width = window.innerWidth; mc.height = window.innerHeight;
            const drops = Array(Math.floor(mc.width/20)).fill(1);
            let timer = 0;
            let mInt = setInterval(() => {
                ctx.fillStyle = "rgba(0,0,0,0.15)"; ctx.fillRect(0,0,mc.width,mc.height);
                ctx.fillStyle = "#f00"; ctx.font = "15px monospace";
                drops.forEach((y, i) => {
                    ctx.fillText(Math.floor(Math.random()*10), i*20, y*20);
                    if(y*20 > mc.height && Math.random() > 0.98) drops[i] = 0;
                    drops[i]++;
                });
                if(++timer > 80) { clearInterval(mInt); mc.style.display = "none"; document.getElementById('res-target').innerText = "TARGET: " + id; document.getElementById('final-result').style.display = "block"; }
            }, 30);
        }

        const canvas = document.getElementById('plexus-canvas'); const ctxP = canvas.getContext('2d'); let dots = [];
        function initP() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; dots = Array(45).fill().map(() => ({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, vx: (Math.random()-0.5)*0.4, vy: (Math.random()-0.5)*0.4 })); }
        function animateP() { ctxP.clearRect(0,0,canvas.width,canvas.height); dots.forEach((p, i) => { p.x += p.vx; p.y += p.vy; if(p.x<0 || p.x>canvas.width) p.vx *= -1; if(p.y<0 || p.y>canvas.height) p.vy *= -1; ctxP.fillStyle = "rgba(255,0,0,0.5)"; ctxP.beginPath(); ctxP.arc(p.x, p.y, 1, 0, Math.PI*2); ctxP.fill(); for(let j=i+1; j<dots.length; j++) { let d = Math.hypot(p.x-dots[j].x, p.y-dots[j].y); if(d<110) { ctxP.strokeStyle = `rgba(255,0,0,${0.6-d/110})`; ctxP.lineWidth=0.5; ctxP.beginPath(); ctxP.moveTo(p.x,p.y); ctxP.lineTo(dots[j].x,dots[j].y); ctxP.stroke(); } } }); requestAnimationFrame(animateP); }
    </script>
</body>
</html>
